name: Update README with latest post

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4a

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Optionnel : si tu veux gray-matter au lieu du parseur minimal
      # - name: Install gray-matter (optional)
      #   run: npm i gray-matter@^4

      - name: Run latest-post script
        env:
          BLOG_BASE_URL: https://devblog-bot-35.vercel.app   # adapte si besoin
          POSTS_DIR: src/content/posts
          README_PATH: README.md
          START_MARKER: LAST_POST_START
          END_MARKER: LAST_POST_END
        run: |
          node scripts/latest-post.js

      - name: Commit changes if any
        run: |
          if git diff --quiet README.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update latest post [skip ci]"
          git push