name: Build PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDFs (guarded)
        run: |
          node --input-type=module -e '
          import { globby } from "globby";
          import { chromium } from "playwright";
          import { writeFileSync, mkdirSync, statSync } from "fs";
          import { join, relative } from "path";

          (async () => {
            const files = await globby(["dist/posts/**/*index.html","dist/posts/**/*.html"]);
            const outDir = "public/pdfs";
            mkdirSync(outDir, { recursive: true });

            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.emulateMedia({ media: "print" });

            const minBytes = 30 * 1024; // PDF < 30 Ko => considéré comme raté

            for (const f of files) {
              const rel = relative("dist/posts", f).replace(/\\/g, "/");
              const slug = rel.endsWith("index.html")
                ? rel.slice(0, -"index.html".length).replace(/\/$/, "")
                : rel.replace(/\.html$/, "");

              const url = "file://" + join(process.cwd(), "dist/posts", rel);
              const safe = (slug || "article").replace(/\/*$/, "").replace(/\//g, "__");
              const out = join(outDir, `${safe}.pdf`);

              try {
                await page.goto(url, { waitUntil: "load" });
                // Validation : attendre la présence d’un contenu article
                await page.waitForSelector("article, main", { timeout: 5000 });

                const pdf = await page.pdf({
                  format: "A4",
                  printBackground: true,
                  margin: { top: "16mm", right: "16mm", bottom: "16mm", left: "16mm" },
                });
                writeFileSync(out, pdf);

                const size = statSync(out).size;
                if (size < minBytes) {
                  console.warn("PDF trop petit, on supprime:", safe, size);
                  await page.screenshot({ path: `public/pdfs/${safe}.png`, fullPage: true }).catch(()=>{});
                  // Si trop petit, on supprime le PDF pour éviter un commit pourri
                  await import("fs").then(fs => fs.unlinkSync(out));
                } else {
                  console.log("PDF OK:", safe, size, "bytes");
                }
              } catch (e) {
                console.error("Raté pour:", safe, e.toString());
              }
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Upload PDFs as artifact (non-main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ github.ref_name }}
          path: public/pdfs
          if-no-files-found: warn
          retention-days: 7

      - name: Commit PDFs (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/pdfs || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(pdf): regenerate article PDFs [skip ci]"
            git push
          else
            echo "Pas de changements."
          fi
