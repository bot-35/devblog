name: Build PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Start preview (background)
        run: npm run preview -- --host 0.0.0.0 &

      - name: Wait for preview to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:4321 >/dev/null; then
              echo "Preview is up!";
              break
            fi
            echo "Waiting for preview..."
            sleep 2
          done

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDFs (depuis src/content/posts)
        run: |
          node --input-type=module -e '
          import { globby } from "globby";
          import matter from "gray-matter";
          import { chromium } from "playwright";
          import { readFileSync, writeFileSync, mkdirSync } from "fs";
          import { join, relative } from "path";

          (async () => {
            const base = "http://127.0.0.1:4321";
            const contentGlob = [
              "src/content/posts/**/*.md",
              "src/content/posts/**/*.mdx"
            ];

            const files = await globby(contentGlob, { gitignore: true });

            // Construit la liste { slug, url } à partir du front-matter
            const posts = files.map(fp => {
              const raw = readFileSync(fp, "utf8");
              const { data } = matter(raw) || {};
              if (data?.draft === true) return null;

              // Priorité au front-matter "slug"
              let slug = data?.slug;
              if (!slug) {
                // fallback : chemin relatif à src/content/posts (sans extension)
                const rel = relative("src/content/posts", fp)
                  .replace(/\\/g, "/")
                  .replace(/\.(md|mdx)$/i, "");
                slug = rel; // supporte dossiers imbriqués: a/b/c -> /posts/a/b/c
              }
              const url = `${base}/posts/${slug}`;
              return { slug, url };
            }).filter(Boolean);

            const outDir = "public/pdfs";
            mkdirSync(outDir, { recursive: true });

            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.emulateMedia({ media: "print" });

            for (const p of posts) {
              console.log("PDF =>", p.slug, p.url);
              await page.goto(p.url, { waitUntil: "networkidle" });
              const pdf = await page.pdf({
                format: "A4",
                printBackground: true,
                margin: { top: "16mm", right: "16mm", bottom: "16mm", left: "16mm" },
              });
              // Remplace les "/" dans les slugs imbriqués pour créer un nom de fichier stable
              const safeName = p.slug.replace(/\/*$/, "").replace(/\//g, "__") || "article";
              writeFileSync(join(outDir, `${safeName}.pdf`), pdf);
            }

            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Commit PDFs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/pdfs || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(pdf): regenerate article PDFs [skip ci]"
            git push
          else
            echo "Pas de changements."
          fi
